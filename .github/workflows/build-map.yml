name: Build map

# Monthly UK build, also startable from the Actions tab:
#   prepare  download the UK extract once and cut it down to highways
#   shard    sample (first run) or refresh each shard in turn, saving state to R2
#   publish  merge the shard tiles into one UK file, build the hexagon overview
#            from the shards' tallies, and upload both
# A shard that hits its time limit saves its progress and fails, which skips
# publish and leaves the current map up; running the workflow again resumes it.
#
# Each shard refreshes if R2 holds its previous result, and samples from scratch
# if not. "Full rebuild" makes every shard sample from scratch, re-asking any
# cached lookup older than 25 days (see pipeline/README.md for when to use it).
run-name: Build map${{ inputs.full_rebuild && ' (full rebuild)' || '' }}

on:
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: >-
          Full rebuild: re-sample every road instead of refreshing. About 12 hours.
          Use once a year, or after changing the sampling rules.
        type: boolean
        default: false
  schedule:
    - cron: "23 4 2 * *"   # 04:23 UTC on the 2nd of each month

# Never run two builds at once: both would write the same state files
concurrency:
  group: build-map
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # keep-alive below

env:
  TIPPECANOE_VERSION: "2.79.0"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # GitHub disables scheduled workflows in public repos after 60 days without
      # commits. Re-enabling it on each run keeps the monthly build going.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/build-map.yml/enable"

      - name: Download the UK extract and keep only highways
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -fsSL -o uk-full.osm.pbf https://download.geofabrik.de/europe/united-kingdom-latest.osm.pbf
          # Keeps highway ways and the nodes they use; the file name is what the pipeline expects
          osmium tags-filter uk-full.osm.pbf w/highway -o united-kingdom-latest.osm.pbf
          ls -lh uk-full.osm.pbf united-kingdom-latest.osm.pbf

      - uses: actions/upload-artifact@v4
        with:
          name: uk-highways
          path: united-kingdom-latest.osm.pbf
          retention-days: 3

  shard:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      # One at a time: they share Google's 500 requests/s limit
      max-parallel: 1
      fail-fast: false
      matrix:
        shard: [uk-1, uk-2, uk-3, uk-4, uk-5, uk-6, uk-7, uk-8, uk-9, uk-10]
    env:
      AREA: ${{ matrix.shard }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 -m pip install -r pipeline/requirements.txt

      - name: Restore tippecanoe build
        id: tippecanoe
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: tippecanoe-${{ env.TIPPECANOE_VERSION }}-with-tile-join-${{ runner.os }}

      - name: Build tippecanoe
        if: steps.tippecanoe.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$TIPPECANOE_VERSION" https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          mkdir -p ~/.local/bin
          cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tile-join ~/.local/bin/

      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          name: uk-highways
          path: pipeline/data

      - name: Restore cache and last result from R2
        id: pull
        run: python3 -m pipeline.run pull-state --area "$AREA"

      # Stops starting new lookups after 300 minutes, leaving time to save state.
      # A full rebuild ignores the previous result and re-asks lookups older than
      # 25 days; ones from an interrupted rebuild this month are reused, so
      # ticking the box again resumes it.
      - name: Sample (first run or full rebuild) or refresh
        env:
          FULL_REBUILD: ${{ inputs.full_rebuild || false }}
        run: |
          OPTS="--area $AREA --rate 400 --concurrency 100 --max-minutes 300"
          if [ "$FULL_REBUILD" = "true" ]; then
            python3 -m pipeline.run sample --mode bisect --max-age-days 25 $OPTS
          elif [ -f "pipeline/data/${AREA}-bisect.pieces.jsonl" ]; then
            python3 -m pipeline.run refresh $OPTS
          else
            python3 -m pipeline.run sample --mode bisect $OPTS
          fi

      # Runs even if sampling stopped early, so lookups made so far aren't lost.
      # Never runs if the restore failed, or it would overwrite good state with nothing.
      - name: Save cache and result to R2
        if: always() && steps.pull.outcome == 'success'
        run: python3 -m pipeline.run push-state --area "$AREA"

      # Tiles, plus the shard's hexagon tallies and top-ten candidates for the overview
      - run: python3 -m pipeline.run tiles --area "$AREA"

      - uses: actions/upload-artifact@v4
        with:
          name: tiles-${{ matrix.shard }}
          path: |
            pipeline/data/site/${{ matrix.shard }}.pmtiles
            pipeline/data/${{ matrix.shard }}.hexstats.json
            pipeline/data/${{ matrix.shard }}.toplists.json
          retention-days: 3

  publish:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_SITE_PREFIX: ${{ secrets.R2_SITE_PREFIX }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 -m pip install -r pipeline/requirements.txt

      - name: Restore tippecanoe build
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/bin
          key: tippecanoe-${{ env.TIPPECANOE_VERSION }}-with-tile-join-${{ runner.os }}
          fail-on-cache-miss: true

      # Each artifact holds site/uk-N.pmtiles, uk-N.hexstats.json and uk-N.toplists.json, relative to pipeline/data
      - uses: actions/download-artifact@v4
        with:
          pattern: tiles-*
          path: pipeline/data
          merge-multiple: true

      - name: Merge shard tiles and build the overview
        run: |
          ~/.local/bin/tile-join -o pipeline/data/site/uk.pmtiles --force --no-tile-size-limit \
            pipeline/data/site/uk-*.pmtiles
          python3 -m pipeline.run overview --area uk
          # The page from the latest main, not this run's commit, so a long build
          # that started before a page change doesn't put the old page back
          git fetch --depth 1 origin main
          git show FETCH_HEAD:pipeline/web/index.html > pipeline/data/site/index.html
          ls -lh pipeline/data pipeline/data/site

      - run: python3 -m pipeline.run publish --area uk
