name: Audit refresh

# Manual only. Measures how much new imagery the monthly refresh misses (see
# pipeline/audit.py), in two steps:
#   baseline  random points along the roads, checked against each shard's last
#             result and the sentinels a refresh would check; the points are
#             kept in the state bucket. Run it a few days before a build.
#   compare   the baseline's points looked up again. Run it straight after the
#             next build: what's newer than at the baseline is new imagery,
#             and the map either has it or the refresh missed it.
# Publishes nothing and never touches the pipeline's cache or results. The
# report is in the run summary and the audit artifact. At the default rate a
# baseline takes about 1 h 45 min; 300/s is about four times faster, but only
# while no build is running.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: baseline (new random points, kept for later) or compare (the kept points again)
        type: choice
        options: [baseline, compare]
        default: baseline
      probes:
        description: "Baseline only: random points per shard (there are 10)"
        type: number
        default: 5000
      rate:
        description: Lookups per second (80 is safe alongside a build; up to 300 when none is running)
        type: number
        default: 80

# Its own group: sharing the build's would let a queued audit cancel a queued
# monthly build. The low rate keeps the two under Google's 500 requests/s if
# they ever overlap.
concurrency:
  group: audit-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 -m pip install -r pipeline/requirements.txt

      - name: Download the UK extract and keep only highways
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          mkdir -p pipeline/data
          curl -fsSL -o uk-full.osm.pbf https://download.geofabrik.de/europe/united-kingdom-latest.osm.pbf
          osmium tags-filter uk-full.osm.pbf w/highway -o pipeline/data/united-kingdom-latest.osm.pbf
          rm uk-full.osm.pbf

      # The last result only, not the lookup caches, which the audit doesn't use
      - name: Restore each shard's last result from R2
        run: |
          for n in $(seq 1 10); do
            python3 -m pipeline.run pull-state --pieces-only --area "uk-$n"
          done

      - name: Audit
        env:
          MODE: ${{ inputs.mode }}
          PROBES: ${{ inputs.probes }}
          RATE: ${{ inputs.rate }}
        run: |
          if [ "$MODE" = "compare" ]; then FLAG=--compare; else FLAG=--save-baseline; fi
          python3 -m pipeline.run audit --area uk $FLAG --probes "$PROBES" --rate "$RATE" --concurrency 100
          cat audit.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: audit
          path: |
            audit.md
            audit.json
          retention-days: 90
